services:
  db:
    image: postgres:18.6
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: celeoproc
      POSTGRES_USER: celeoproc
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celeoproc -d celeoproc"]
      interval: 5s
      timeout: 5s
      retries: 12

  bot:
    build: .
    image: eeshe/celeoproc:latest
    env_file: .env
    environment:
      # Overrides the localhost in .env so the bot reaches the db service.
      PGHOST: db
    volumes:
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
