services:
  db:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5432:5432"
    env_file: .env.db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  bot:
    image: eeshe/celeoproc:latest
    env_file:
      - .env.db
      - .env.bot
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
