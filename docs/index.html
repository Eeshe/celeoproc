<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celeoproc — A power outage tracker for Discord</title>
    <meta
      name="description"
      content="Celeoproc is a Discord bot that tracks power outages: your server logs when the power goes out and comes back, and Celeoproc keeps the stats."
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/i18n.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <a
      class="github-link"
      href="https://github.com/Eeshe/celeoproc"
      target="_blank"
      rel="noopener"
      data-i18n-aria-label="github"
      aria-label="Celeoproc on GitHub"
    >
      <svg
        class="github-link__icon"
        viewBox="0 0 16 16"
        width="20"
        height="20"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>

    <button
      id="lang-toggle"
      class="lang-toggle"
      type="button"
      aria-label="Switch to Spanish"
    >
      ES
    </button>

    <main class="hero">
      <h1 class="hero__logo">
        <img src="assets/logo.svg" alt="Celeoproc" width="418" height="67" />
      </h1>
      <p class="hero__tagline" data-i18n="tagline">
        A power outage tracker for Discord.
      </p>
      <p class="hero__support" data-i18n="support">
        Your server logs when the power goes out and comes back, and Celeoproc
        keeps the stats.
      </p>
      <a
        class="install-btn"
        href="https://discord.com/oauth2/authorize?client_id=1547764534335508520"
        target="_blank"
        rel="noopener"
        data-i18n="install"
      >
        Add to Discord
      </a>
    </main>

    <footer class="footer">
      <p data-i18n="footer">Made for communities that lose power.</p>
    </footer>
  </body>
</html>
